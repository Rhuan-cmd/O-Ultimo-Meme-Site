            color: #fff;

        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 4px; }
        
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .glitch-text:hover {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            color: #ef4444;
        }
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        .podium-2 { animation: slideUp 0.8s ease-out 0.2s forwards; opacity: 0; animation-fill-mode: forwards; }
        .podium-3 { animation: slideUp 0.8s ease-out 0.4s forwards; opacity: 0; animation-fill-mode: forwards; }
        
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

            // --- LÓGICA E UTILS ---
            function lerHash(token, key) {
                try {
                    if(!token || !key) return null;
                    let decoded = atob(token).split('').map((c, i) => String.fromCharCode(c.charCodeAt(0) ^ key.charCodeAt(i % key.length))).join('');
                    let d = decoded.split('|');
                    return d.length === 4 && d[3] === "OK" ? { tempo: d[0], mortes: Number(d[1]), data: d[2], isValid: true } : null;
                } catch (e) { return null; }
            }

            const formatDisplayTime = (s) => {
                if (!s) return "--";
                const p = s.split(':').map(Number);
                return p.length === 3 ? `${p[0]}h ${p[1]}m ${p[2]}s` : `${p[0]}m ${p[1]}s`;
            };

            const timeToSeconds = (s) => {
                if (!s) return 999999;
                const p = s.split(':').map(Number);
                return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p[0]*60 + p[1];
            };

            const parseRunDate = (dateStr) => {
                if(!dateStr) return 9999999999999;
                try {
                    const [d, t] = dateStr.split(' ');
                    const [day, month, year] = d.split('/').map(Number);
                    const [hour, min] = t ? t.split(':').map(Number) : [0,0];
                    return new Date(year, month - 1, day, hour, min).getTime();
                } catch(e) { return 9999999999999; }
            };

                    <div className="flex justify-center mb-16">

            const AuthPage = ({ setUser, setActiveTab }) => {
                const [isLogin, setIsLogin] = React.useState(true);
                const [email, setEmail] = React.useState('');
                const [password, setPassword] = React.useState('');

                const [loading, setLoading] = React.useState(false);

                const handleAuth = async (e) => {
                    e.preventDefault();
                    setLoading(true);
                    try {
                        let res;
                        if(isLogin) res = await signInWithEmailAndPassword(auth, email, password);
                        else {
                            res = await createUserWithEmailAndPassword(auth, email, password);
                            await setDoc(doc(db, 'artifacts', APP_ID, 'users', res.user.uid), { displayName: email.split('@')[0], createdAt: serverTimestamp() });

                const decide = async (run, approve) => {
                    const runRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'runs', run.id);
                    const userRef = collection(db, 'artifacts', APP_ID, 'users', run.userId, 'messages');
                    
                    if(approve && run.decodedData) {

                const sendDirectMessage = async () => {

                    await addDoc(collection(db, 'artifacts', APP_ID, 'users', msgTarget.userId, 'messages'), { title: 'Mensagem do Admin 🛡️', body: msgText, createdAt: serverTimestamp(), read: false });
                    alert("Mensagem enviada!"); setMsgTarget(null); setMsgText('');
                }

                const acceptAllValid = async () => {
                    const validOnes = processedRuns.filter(r => r.isValid);

                };

                return (
                    <div className="max-w-4xl mx-auto px-4 py-10">
                        <div className="flex justify-between items-center mb-10 border-b border-gray-800 pb-6">
                            <div><h2 className="text-3xl font-black text-red-600 uppercase tracking-tighter">Painel Admin</h2><p className="text-gray-500 text-sm">Bem-vindo, Administrador.</p></div>
                            <div className="bg-gray-900 px-4 py-2 rounded border border-gray-800 flex gap-3 items-center"><Lock size={16} className={key ? "text-green-500" : "text-red-500"}/><span className={`text-xs font-mono font-bold ${key ? "text-green-500" : "text-red-500"}`}>{key ? "KEY ATIVA" : "SEM KEY"}</span></div>

            const Winners = ({ user }) => {
                const [timeLeft, setTimeLeft] = React.useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
                const target = React.useMemo(() => new Date('2026-02-15T00:00:00'), []);
                const [stats, setStats] = React.useState(null);
                const [forceReveal, setForceReveal] = React.useState(false);
                
                const isAdmin = user && user.email === ADMIN_EMAIL;
                const now = new Date(); 
                const revealed = (now >= target) || forceReveal;

                React.useEffect(() => {
                    const calculateTime = () => {
                        const diff = target - new Date();
                        if (diff <= 0) {
                            setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0 });
                            return false;
                        }
                        setTimeLeft({
                            days: Math.floor(diff / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                            minutes: Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)),
                            seconds: Math.floor((diff % (1000 * 60)) / 1000)
                        });
                        return true;
                    };

                    calculateTime();
                    const timer = setInterval(() => {
                        const shouldContinue = calculateTime();
                        if (!shouldContinue) clearInterval(timer);
                    }, 1000);
                    return () => clearInterval(timer);
                }, [target]);

                React.useEffect(() => {
                    if(!revealed) return;
                    const unsub = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'runs'), (snap) => {
                        let runs = snap.docs.map(d=>d.data()).filter(r=>r.status==='approved');
                        runs = runs.filter(r => new Date(r.createdAt) <= target);

                        if(runs.length > 0) {
                            const byTime = [...runs].sort((a,b) => a.sortTime - b.sortTime);
                            const byDate = [...runs].sort((a,b) => parseRunDate(a.decryptedData.data) - parseRunDate(b.decryptedData.data));
                            const byLast = [...runs].sort((a,b) => b.sortTime - a.sortTime);
                            setStats({ fastest: byTime[0], first: byDate[0], last: byLast[0] });
                        }
                    });
                    return () => unsub();
                }, [revealed, target]);

                if(!revealed) return (
                    <div className="min-h-[80vh] flex flex-col items-center justify-center text-white bg-black p-4 text-center">
                        <div className="relative mb-8"><div className="absolute inset-0 bg-red-600 blur-xl opacity-20 animate-pulse"></div><Lock size={64} className="text-red-600 relative z-10"/></div>

                            <div className="bg-gray-900 p-2 md:p-4 rounded-lg border border-red-900/30"><div className="text-xl md:text-5xl font-bold text-white mb-2">{String(timeLeft.days).padStart(2, '0')}</div><div className="text-[10px] md:text-xs text-red-500 uppercase tracking-widest">Dias</div></div>
                            <div className="bg-gray-900 p-2 md:p-4 rounded-lg border border-red-900/30"><div className="text-xl md:text-5xl font-bold text-white mb-2">{String(timeLeft.hours).padStart(2, '0')}</div><div className="text-[10px] md:text-xs text-red-500 uppercase tracking-widest">Horas</div></div>
                            <div className="bg-gray-900 p-2 md:p-4 rounded-lg border border-red-900/30"><div className="text-xl md:text-5xl font-bold text-white mb-2">{String(timeLeft.minutes).padStart(2, '0')}</div><div className="text-[10px] md:text-xs text-red-500 uppercase tracking-widest">Min</div></div>
                            <div className="bg-gray-900 p-2 md:p-4 rounded-lg border border-red-900/30"><div className="text-xl md:text-5xl font-bold text-white mb-2">{String(timeLeft.seconds).padStart(2, '0')}</div><div className="text-[10px] md:text-xs text-red-500 uppercase tracking-widest">Seg</div></div>
                        </div>
                        {isAdmin && (
                            <button onClick={() => setForceReveal(true)} className="px-6 py-2 bg-yellow-900/30 text-yellow-500 border border-yellow-700/50 rounded font-bold text-xs hover:bg-yellow-900/50 transition-colors uppercase tracking-widest">
                                Admin: Simular Revelação
                            </button>
                        )}
                    </div>
                );

                const WinnerCard = ({ title, desc, data, rank, color, prize, icon: Icon }) => (
                    <div className="relative z-10 flex flex-col items-center">
                        <div className={`text-${color}-500 font-bold mb-1 uppercase tracking-widest text-sm`}>{title}</div>
                        <div className="text-gray-500 text-[10px] uppercase mb-2">{desc}</div>
                        <div className={`w-20 h-20 rounded-full bg-gray-800 border-4 border-${color}-600 flex items-center justify-center mb-[-40px] z-20 shadow-lg`}><span className={`text-3xl font-black text-${color}-400`}>{rank}</span></div>
                        <div className={`bg-gradient-to-b from-gray-800 to-gray-900 w-full rounded-t-lg border-t-4 border-${color}-600 pt-16 pb-8 px-6 shadow-2xl h-80 flex flex-col justify-between`}>
                            {data ? (
                                <>
                                    <div><div className="text-2xl font-bold text-white mb-1 truncate">{data.userName}</div><div className="flex justify-between items-center text-xs text-gray-400 mt-2 border-b border-gray-700 pb-2"><span>Data:</span><span className="font-mono text-white">{data.decryptedData.data}</span></div><div className="flex justify-between items-center text-xs text-gray-400 mt-2"><span>Mortes:</span><span className="font-mono text-red-400 font-bold">{data.decryptedData.mortes}</span></div></div>
                                    <div className="text-center"><div className={`bg-black/50 rounded p-2 mb-2 inline-block ${prize ? 'text-green-400' : 'text-gray-500'}`}><span className="font-bold">{prize || "Menção Honrosa"}</span></div><div className={`text-${color}-500 font-mono text-2xl font-bold`}>{formatDisplayTime(data.decryptedData.tempo)}</div></div>
                                </>
                            ) : <span className="text-gray-600 my-auto">--</span>}
                        </div>
                    </div>
                );

                return (
                    <div className="max-w-7xl mx-auto px-4 py-12 text-center min-h-[80vh] flex flex-col justify-center">
                        <h2 className="text-5xl md:text-7xl font-black mb-24 text-red-600 uppercase drop-shadow-[0_0_30px_rgba(220,38,38,0.4)] tracking-tighter">Lendas de 2026</h2>
                        <div className="flex flex-col md:flex-row items-end justify-center gap-12 md:gap-4 relative px-4">
                            <div className="w-full md:w-1/3 order-2 md:order-1 podium-2"><WinnerCard title="O Pioneiro" desc="Quem zerou primeiro" data={stats?.first} rank="#2" color="gray" prize="R$ 20,00" icon={Calendar} /></div>
                            <div className="w-full md:w-1/3 order-1 md:order-2 z-20 podium-1 -mx-0 md:-mx-2 mb-8 md:mb-0">
                                 <div className="relative z-10 flex flex-col items-center transform md:-translate-y-8">
                                    <Crown size={48} className="text-yellow-400 mb-2 animate-bounce"/>
                                    <div className="text-yellow-400 font-bold mb-1 uppercase tracking-widest text-lg glow-text">Velocista Supremo</div>
                                    <div className="text-gray-400 text-xs uppercase mb-2">Quem zerou mais rápido</div>
                                    <div className="w-28 h-28 rounded-full bg-yellow-900/80 border-4 border-yellow-400 flex items-center justify-center mb-[-50px] z-20 shadow-[0_0_30px_rgba(234,179,8,0.4)]"><span className="text-5xl font-black text-yellow-400">#1</span></div>
                                    <div className="bg-gradient-to-b from-gray-800 to-black w-full rounded-t-lg border-t-4 border-yellow-400 pt-20 pb-10 px-6 shadow-2xl h-96 flex flex-col justify-between relative overflow-hidden">
                                        <div className="absolute inset-0 bg-yellow-500/5 animate-pulse"></div>
                                        {stats?.fastest ? (
                                            <>
                                                <div className="relative z-10"><div className="text-4xl font-black text-white mb-1 truncate">{stats.fastest.userName}</div><div className="flex justify-between items-center text-sm text-gray-400 mt-4 border-b border-gray-700 pb-2"><span>Data:</span><span className="font-mono text-white">{stats.fastest.decryptedData.data}</span></div><div className="flex justify-between items-center text-sm text-gray-400 mt-2"><span>Mortes:</span><span className="font-mono text-red-500 font-bold">{stats.fastest.decryptedData.mortes}</span></div></div>
                                                <div className="relative z-10 text-center"><div className="bg-yellow-500/20 border border-yellow-500/50 rounded p-3 mb-4 inline-block"><span className="text-yellow-400 font-black text-2xl">R$ 30,00</span></div><div className="text-green-400 font-mono text-4xl font-bold">{formatDisplayTime(stats.fastest.decryptedData.tempo)}</div></div>
                                            </>
                                        ) : <span className="text-gray-600 my-auto">--</span>}
                                    </div>
                                 </div>
                            </div>
                            <div className="w-full md:w-1/3 order-3 podium-3"><WinnerCard title="O Sobrevivente" desc="Quem ficou em último" data={stats?.last} rank="#3" color="orange" prize={null} icon={Skull} /></div>
                        </div>
                    </div>
                );
            };

            const App = () => {
                const [activeTab, setActiveTab] = React.useState('home');
                const [user, setUser] = React.useState(null);
                const [loading, setLoading] = React.useState(true);
                const [unread, setUnread] = React.useState(0);

                React.useEffect(() => {
                    const unsub = onAuthStateChanged(auth, u => { setUser(u); setLoading(false); });
                    return () => unsub();
                }, []);

                React.useEffect(() => {
                    if(!user) return;
                    const unsub = onSnapshot(collection(db, 'artifacts', APP_ID, 'users', user.uid, 'messages'), s => {
                        setUnread(s.docs.filter(d => !d.data().read).length);
                    });
                    return () => unsub();
                }, [user]);

                if(loading) return <div className="h-screen flex flex-col items-center justify-center bg-black gap-4"><div className="w-12 h-12 border-4 border-red-600 border-t-transparent rounded-full animate-spin"></div><p className="text-red-600 font-bold text-xs tracking-widest animate-pulse">CARREGANDO SISTEMA...</p></div>;

                return (
                    <div className="min-h-screen flex flex-col">
                        <Navbar activeTab={activeTab} setActiveTab={setActiveTab} user={user} unreadCount={unread}/>
                        <main className="flex-grow fade-in">
                            {activeTab === 'home' && <Hero setActiveTab={setActiveTab}/>}
                            {activeTab === 'auth' && <AuthPage setUser={setUser} setActiveTab={setActiveTab}/>}
                            {activeTab === 'profile' && user && <Profile user={user}/>}
                            {activeTab === 'admin' && user && <AdminPanel user={user}/>}
                            {activeTab === 'ranking' && <Ranking/>}
                            {activeTab === 'winners' && <Winners user={user}/>}
                        </main>
                        <footer className="py-10 text-center border-t border-red-900/10 text-gray-800 text-[10px] uppercase tracking-widest">
                            &copy; 2024-2026 O Último Meme. Todos os direitos reservados.
                        </footer>
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        }

        // Inicia o app apenas quando o Firebase estiver pronto
        if (window.FirebaseLib) {
            initApp();
        } else {
            window.addEventListener('firebase-ready', initApp);
        }
    </script>
</body>
</html>
