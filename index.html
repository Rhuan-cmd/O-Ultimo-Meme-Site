<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O Último Meme - Competição</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Estilos Customizados -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #fff;
            overflow-x: hidden;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 4px; }
        
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .glitch-text:hover {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            color: #ef4444;
        }
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        
        /* Podium Animations */
        .podium-1 { animation: slideUp 0.8s ease-out forwards; }
        .podium-2 { animation: slideUp 0.8s ease-out 0.2s forwards; opacity: 0; animation-fill-mode: forwards; }
        .podium-3 { animation: slideUp 0.8s ease-out 0.4s forwards; opacity: 0; animation-fill-mode: forwards; }
        
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, doc, updateDoc, deleteDoc, setDoc, getDoc, getDocs, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- ICONS ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );

        const Icons = {
            Flame: (props) => <IconBase {...props}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.1.2-2.2.5-3.3.3 1.6 1 3.1 3 4.8z"/></IconBase>,
            Trophy: (props) => <IconBase {...props}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></IconBase>,
            CheckCircle: (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>,
            User: (props) => <IconBase {...props}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconBase>,
            ShieldAlert: (props) => <IconBase {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="M12 8v4"/><path d="M12 16h.01"/></IconBase>,
            LogOut: (props) => <IconBase {...props}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></IconBase>,
            Menu: (props) => <IconBase {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></IconBase>,
            X: (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>,
            Gamepad2: (props) => <IconBase {...props}><line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/></IconBase>,
            Lock: (props) => <IconBase {...props}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconBase>,
            Calendar: (props) => <IconBase {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></IconBase>,
            PlayCircle: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></IconBase>,
            Skull: (props) => <IconBase {...props}><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><path d="M8 20v2h8v-2"/><path d="m12.5 17-.5-1-.5 1h1z"/><path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"/></IconBase>,
            Mail: (props) => <IconBase {...props}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></IconBase>,
            Timer: (props) => <IconBase {...props}><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></IconBase>,
            Eye: (props) => <IconBase {...props}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></IconBase>,
            Settings: (props) => <IconBase {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>,
            XCircle: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></IconBase>,
            ArrowRight: (props) => <IconBase {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconBase>,
            Key: (props) => <IconBase {...props}><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></IconBase>,
            Crown: (props) => <IconBase {...props}><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></IconBase>,
            Medal: (props) => <IconBase {...props}><path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/><path d="M11 12 5.12 2.2"/><path d="m13 12 5.88-9.8"/><path d="M8 7h8"/><circle cx="12" cy="17" r="5"/><path d="M12 18v-2h-.5"/></IconBase>,
            Trash2: (props) => <IconBase {...props}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconBase>,
            Send: (props) => <IconBase {...props}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></IconBase>,
            MessageSquare: (props) => <IconBase {...props}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></IconBase>,
            Download: (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></IconBase>,
            Edit2: (props) => <IconBase {...props}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></IconBase>
        };

        const { Trophy, Timer, Skull, User, Mail, ShieldAlert, CheckCircle, XCircle, Gamepad2, Lock, Calendar, PlayCircle, Menu, X, Flame, Eye, LogOut, Settings, ArrowRight, Key, Crown, Medal, Trash2, Send, MessageSquare, Download, Edit2 } = Icons;

        // --- FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyB1Bh3xlf9rcySsLiS1wAADz74EctsTb7M",
            authDomain: "o-ultimo-meme-site.firebaseapp.com",
            projectId: "o-ultimo-meme-site",
            storageBucket: "o-ultimo-meme-site.firebasestorage.app",
            messagingSenderId: "455120112453",
            appId: "1:455120112453:web:1af3a88fb49e27ae65cc2c",
            measurementId: "G-EJWQY6KFVP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const APP_ID = "oum-comp-prod-v1";
        const ADMIN_EMAIL = "rhuanbrasilino@acad.ifma.edu.br";

        // --- LOGICA ---
        function lerHash(token, key) {
            try {
                if(!token || !key) return null;
                let decoded = atob(token).split('').map((c, i) => 
                    String.fromCharCode(c.charCodeAt(0) ^ key.charCodeAt(i % key.length))
                ).join('');

                let dados = decoded.split('|');
                if (dados.length !== 4 || dados[3] !== "OK") return null;
                
                return { 
                    tempo: dados[0], 
                    mortes: Number(dados[1]), 
                    data: dados[2], 
                    isValid: true
                };
            } catch (e) { return null; }
        }

        const timeToSeconds = (timeStr) => {
            if (!timeStr) return 9999999;
            const parts = timeStr.split(':').map(Number);
            let seconds = 0;
            if (parts.length === 3) seconds += parts[0] * 3600 + parts[1] * 60 + parts[2];
            else if (parts.length === 2) seconds += parts[0] * 60 + parts[1];
            return seconds;
        };

        const parseRunDate = (dateStr) => {
            if(!dateStr) return 0;
            try {
                const [d, t] = dateStr.split(' ');
                const [day, month, year] = d.split('/').map(Number);
                const [hour, min] = t ? t.split(':').map(Number) : [0,0];
                return new Date(year, month - 1, day, hour, min).getTime();
            } catch(e) { return 0; }
        };

        const formatDisplayTime = (timeStr) => {
            if (!timeStr) return "--";
            const parts = timeStr.split(':').map(Number);
            if (parts.length === 3) return `${parts[0]}h ${parts[1]}min ${parts[2]}s`;
            if (parts.length === 2) return `${parts[0]}min ${parts[1]}s`;
            return timeStr;
        };

        // --- COMPONENTES ---

        const Navbar = ({ activeTab, setActiveTab, user, unreadCount }) => {
            const [isOpen, setIsOpen] = React.useState(false);
            const isAdmin = user && user.email === ADMIN_EMAIL;
            const menuItems = [
                { id: 'home', label: 'Início', icon: <Flame size={18} /> },
                { id: 'ranking', label: 'Ranking', icon: <Trophy size={18} /> },
                { id: 'winners', label: 'Ganhadores', icon: <CheckCircle size={18} /> },
            ];

            return (
                <nav className="bg-black/95 border-b border-red-900/40 text-white sticky top-0 z-50 backdrop-blur-md shadow-[0_4px_30px_rgba(220,38,38,0.15)]">
                    <div className="max-w-7xl mx-auto px-4">
                        <div className="flex justify-between items-center h-16">
                            <div className="flex items-center gap-2 cursor-pointer group" onClick={() => setActiveTab('home')}>
                                <div className="w-9 h-9 bg-gradient-to-br from-red-600 to-orange-600 rounded flex items-center justify-center font-bold font-mono text-black group-hover:rotate-12 transition-transform">M</div>
                                <span className="font-black text-xl tracking-tighter uppercase hidden sm:block text-white group-hover:text-red-500 transition-colors">
                                    O Último <span className="text-red-500 group-hover:text-white transition-colors">Meme</span>
                                </span>
                            </div>
                            <div className="hidden md:flex items-center space-x-4">
                                {menuItems.map((item) => (
                                    <button key={item.id} onClick={() => setActiveTab(item.id)}
                                        className={`flex items-center gap-2 px-3 py-2 rounded transition-all ${activeTab === item.id ? 'bg-red-600/20 text-red-500 border border-red-600/50 font-bold' : 'text-gray-400 hover:text-white hover:bg-white/5'}`}>
                                        {item.icon} <span>{item.label}</span>
                                    </button>
                                ))}
                                {user && (
                                    <>
                                        <button onClick={() => setActiveTab('profile')} className={`flex items-center gap-2 px-3 py-2 rounded ${activeTab === 'profile' ? 'bg-red-600/20 text-red-500 border border-red-600/50' : 'text-gray-400 hover:text-white'}`}>
                                            <div className="relative">
                                                <User size={18} />
                                                {unreadCount > 0 && <span className="absolute -top-2 -right-2 bg-yellow-500 text-black text-[10px] w-4 h-4 flex items-center justify-center rounded-full animate-pulse">{unreadCount}</span>}
                                            </div>
                                            <span>Perfil</span>
                                        </button>
                                        {isAdmin && (
                                            <button onClick={() => setActiveTab('admin')} className={`flex items-center gap-2 px-3 py-2 rounded ${activeTab === 'admin' ? 'bg-red-600 text-white shadow-[0_0_15px_rgba(220,38,38,0.5)]' : 'text-red-500 hover:text-red-400 border border-red-900/50'}`}>
                                                <ShieldAlert size={18} /> <span>Admin</span>
                                            </button>
                                        )}
                                        <button onClick={() => {signOut(auth); setActiveTab('home');}} className="ml-4 flex items-center gap-2 px-3 py-2 text-gray-500 hover:text-white border-l border-gray-800">
                                            <LogOut size={18} />
                                        </button>
                                    </>
                                )}
                                {!user && <button onClick={() => setActiveTab('auth')} className="bg-gradient-to-r from-orange-600 to-red-600 text-white px-5 py-2 rounded font-bold ml-4 hover:shadow-[0_0_20px_rgba(220,38,38,0.4)] transition-all">Entrar</button>}
                            </div>
                            <div className="md:hidden">
                                <button onClick={() => setIsOpen(!isOpen)} className="text-gray-300">{isOpen ? <X size={24} /> : <Menu size={24} />}</button>
                            </div>
                        </div>
                    </div>
                    {isOpen && (
                        <div className="md:hidden bg-black/95 border-b border-red-900/40">
                            <div className="px-4 pt-2 pb-4 space-y-2">
                                {menuItems.map((item) => (
                                    <button key={item.id} onClick={() => { setActiveTab(item.id); setIsOpen(false); }} className={`flex items-center gap-3 w-full px-4 py-3 rounded text-left ${activeTab === item.id ? 'bg-red-900/20 text-red-500 font-bold' : 'text-gray-400'}`}>
                                        {item.icon} <span>{item.label}</span>
                                    </button>
                                ))}
                                {user ? (
                                    <>
                                        <button onClick={() => { setActiveTab('profile'); setIsOpen(false); }} className="flex items-center gap-3 w-full px-4 py-3 text-gray-400"><User size={18}/> Perfil</button>
                                        {isAdmin && <button onClick={() => { setActiveTab('admin'); setIsOpen(false); }} className="flex items-center gap-3 w-full px-4 py-3 text-red-500 font-bold"><ShieldAlert size={18}/> Admin</button>}
                                        <button onClick={() => { signOut(auth); setIsOpen(false); }} className="flex items-center gap-3 w-full px-4 py-3 text-gray-500 border-t border-gray-800 mt-2"><LogOut size={18}/> Sair</button>
                                    </>
                                ) : (
                                    <button onClick={() => { setActiveTab('auth'); setIsOpen(false); }} className="w-full bg-red-600 text-white py-3 rounded font-bold mt-2">Entrar / Registrar</button>
                                )}
                            </div>
                        </div>
                    )}
                </nav>
            );
        };

        const HowItWorksCard = ({ icon, step, title, desc }) => (
            <div className="bg-gray-900/80 border border-gray-800 p-6 rounded-xl relative group hover:border-red-600/50 transition-colors">
                <div className="absolute -top-4 -left-4 w-10 h-10 bg-red-600 rounded-full flex items-center justify-center font-black text-xl shadow-lg z-10">{step}</div>
                <div className="mb-4 text-gray-500 group-hover:text-red-500 transition-colors">{icon}</div>
                <h3 className="text-xl font-bold mb-2 text-white">{title}</h3>
                <p className="text-sm text-gray-400 leading-relaxed">{desc}</p>
            </div>
        );

        const Hero = ({ setActiveTab }) => (
            <div className="relative bg-black min-h-[calc(100vh-64px)] text-white pb-20">
                <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-20 z-0"></div>
                <div className="absolute inset-0 bg-gradient-to-b from-black via-transparent to-black z-0 pointer-events-none"></div>
                
                <div className="relative z-10 max-w-6xl mx-auto px-4 pt-16 flex flex-col items-center text-center">
                    <h1 className="text-5xl md:text-8xl font-black mb-6 tracking-tighter drop-shadow-2xl">
                        <span className="text-transparent bg-clip-text bg-gradient-to-b from-orange-400 to-red-600 glitch-text">O ÚLTIMO</span>
                        <br />
                        <span className="text-white text-6xl md:text-9xl glitch-text">MEME</span>
                    </h1>
                    
                    <p className="text-xl text-gray-400 mb-12 max-w-2xl italic border-l-4 border-red-600 pl-4">
                        "O apocalipse digital chegou. Corra, sobreviva e garanta seu lugar na história antes que tudo seja deletado."
                    </p>

                    <div className="flex justify-center mb-16">
                        <a href="#" className="flex items-center gap-3 px-12 py-5 bg-gradient-to-r from-red-700 to-red-500 hover:from-red-600 hover:to-red-400 text-white font-black text-xl rounded-full uppercase tracking-widest shadow-[0_0_40px_rgba(220,38,38,0.5)] transform hover:scale-105 transition-all animate-bounce">
                            <Download size={28}/> BAIXAR JOGO AGORA
                        </a>
                    </div>

                     <div className="w-full text-left mb-16">
                        <div className="flex items-center gap-4 mb-10 justify-center">
                            <div className="h-px bg-gradient-to-r from-transparent via-red-600 to-transparent w-full max-w-xs"></div>
                            <h2 className="text-2xl md:text-3xl font-black text-center uppercase tracking-widest text-red-500">Como Participar</h2>
                            <div className="h-px bg-gradient-to-r from-transparent via-red-600 to-transparent w-full max-w-xs"></div>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                            <HowItWorksCard step="1" icon={<Gamepad2 size={40}/>} title="Jogue o Jogo" desc="Baixe 'O Último Meme' e treine suas habilidades. O objetivo é zerar o jogo no menor tempo possível." />
                            <HowItWorksCard step="2" icon={<Key size={40}/>} title="Pegue a Chave" desc="Ao finalizar o jogo, você receberá um Código Criptografado único. Copie esse código, ele é sua prova." />
                            <HowItWorksCard step="3" icon={<Mail size={40}/>} title="Envie a Run" desc="Crie sua conta aqui no site, vá em Perfil e cole seu código. O Admin validará sua run manualmente." />
                            <HowItWorksCard step="4" icon={<Trophy size={40}/>} title="Vença" desc="Os resultados finais serão revelados em 15/02/2026. Apenas os melhores serão imortalizados." />
                        </div>
                    </div>

                    <div className="w-full max-w-4xl aspect-video bg-black rounded-2xl overflow-hidden shadow-[0_0_50px_rgba(220,38,38,0.2)] border border-red-900 mb-20 group relative">
                        <div className="absolute inset-0 bg-red-600/10 group-hover:bg-transparent transition-colors pointer-events-none z-10"></div>
                        <iframe className="w-full h-full relative z-0" src="https://www.youtube.com/embed/5E60kflRAzA?si=Zn3BHn535i1eDNDm" title="Trailer" frameBorder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowFullScreen></iframe>
                    </div>

                    <div className="flex flex-col sm:flex-row justify-center gap-6 w-full px-4">
                        <button onClick={() => setActiveTab('ranking')} className="w-full sm:w-auto px-10 py-4 bg-gray-900 hover:bg-gray-800 text-white font-black rounded text-lg uppercase tracking-widest border border-gray-700 hover:border-white transition-all flex items-center justify-center gap-3">
                            <Trophy size={20}/> Ver Ranking
                        </button>
                        <button onClick={() => setActiveTab('auth')} className="w-full sm:w-auto px-10 py-4 bg-transparent border border-red-600 text-red-500 hover:bg-red-600/10 font-bold rounded text-lg uppercase tracking-widest transition-all flex items-center justify-center gap-3">
                            <User size={20}/> Área do Jogador
                        </button>
                    </div>
                </div>
            </div>
        );

        const AuthPage = ({ setUser, setActiveTab }) => {
            const [isLogin, setIsLogin] = React.useState(true);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [error, setError] = React.useState('');
            const [loading, setLoading] = React.useState(false);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    let userCred;
                    if (isLogin) {
                        userCred = await signInWithEmailAndPassword(auth, email, password);
                    } else {
                        userCred = await createUserWithEmailAndPassword(auth, email, password);
                        await setDoc(doc(db, 'artifacts', APP_ID, 'users', userCred.user.uid), {
                            email: userCred.user.email,
                            displayName: userCred.user.email.split('@')[0],
                            role: 'user',
                            createdAt: serverTimestamp()
                        });
                    }
                    setUser(userCred.user);
                    setActiveTab(userCred.user.email === ADMIN_EMAIL ? 'admin' : 'profile');
                } catch (err) { setError("Erro: " + err.message); } finally { setLoading(false); }
            };

            return (
                <div className="min-h-screen bg-black flex items-center justify-center px-4 bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')]">
                    <div className="max-w-md w-full bg-gray-900 border border-red-900/50 p-8 rounded-2xl shadow-[0_0_60px_rgba(220,38,38,0.1)]">
                        <h2 className="text-3xl font-black text-center text-white mb-8 uppercase tracking-widest">{isLogin ? 'Login do Agente' : 'Novo Registro'}</h2>
                        {error && <div className="bg-red-900/30 border border-red-500 text-red-200 p-3 rounded mb-4 text-sm flex items-center gap-2"><XCircle size={16}/>{error}</div>}
                        <form onSubmit={handleAuth} className="space-y-6">
                            <div><label className="text-xs font-bold text-red-500 uppercase tracking-wider">Email</label><input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full bg-black border border-gray-700 rounded p-3 text-white focus:border-red-500 outline-none mt-1 transition-colors" placeholder="agente@oultimomeme.com"/></div>
                            <div><label className="text-xs font-bold text-red-500 uppercase tracking-wider">Senha</label><input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-black border border-gray-700 rounded p-3 text-white focus:border-red-500 outline-none mt-1 transition-colors" placeholder="••••••••"/></div>
                            <button disabled={loading} className="w-full bg-gradient-to-r from-red-700 to-red-600 hover:from-red-600 hover:to-red-500 text-white font-bold py-3 rounded uppercase tracking-wider disabled:opacity-50 transition-all shadow-lg">{loading ? 'Autenticando...' : (isLogin ? 'Acessar Sistema' : 'Criar Credencial')}</button>
                        </form>
                        <button onClick={() => setIsLogin(!isLogin)} className="w-full text-center mt-6 text-gray-500 hover:text-white text-sm transition-colors">{isLogin ? 'Não possui acesso? Registre-se' : 'Já possui conta? Faça login'}</button>
                    </div>
                </div>
            );
        };

        const Profile = ({ user }) => {
            const [secretKey, setSecretKey] = React.useState('');
            const [videoUrl, setVideoUrl] = React.useState('');
            const [status, setStatus] = React.useState(null);
            const [runs, setRuns] = React.useState([]);
            const [msgs, setMsgs] = React.useState([]);
            const [userProfile, setUserProfile] = React.useState(null);
            const [isEditing, setIsEditing] = React.useState(false);
            const [newName, setNewName] = React.useState('');

            React.useEffect(() => {
                if(!user) return;
                
                // Get User Profile
                const unsubProfile = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid), (doc) => {
                    if (doc.exists()) {
                        const data = doc.data();
                        setUserProfile(data);
                        setNewName(data.displayName || user.email.split('@')[0]);
                    }
                });

                const unsubRuns = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'runs'), (snap) => {
                    const myRuns = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(r => r.userId === user.uid);
                    myRuns.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                    setRuns(myRuns);
                });
                const unsubMsgs = onSnapshot(collection(db, 'artifacts', APP_ID, 'users', user.uid, 'messages'), (snap) => {
                    const myMsgs = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    myMsgs.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    setMsgs(myMsgs);
                });
                return () => { unsubProfile(); unsubRuns(); unsubMsgs(); };
            }, [user]);

            const saveProfileName = async () => {
                if(!newName.trim()) return;
                try {
                    // 1. Update Profile
                    await updateDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid), { displayName: newName });
                    
                    // 2. Batch update user's name in ALL their runs for ranking consistency
                    const q = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'runs'), where('userId', '==', user.uid));
                    const querySnapshot = await getDocs(q);
                    const batch = writeBatch(db);
                    querySnapshot.forEach((doc) => {
                        batch.update(doc.ref, { userName: newName });
                    });
                    await batch.commit();
                    
                    setIsEditing(false);
                } catch(e) { console.error("Error updating name:", e); }
            }

            const sendRun = async (e) => {
                e.preventDefault();
                setStatus('loading');
                try {
                    await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'runs'), {
                        userId: user.uid,
                        userName: userProfile?.displayName || user.email.split('@')[0],
                        encryptedToken: secretKey,
                        videoUrl: videoUrl || null,
                        status: 'pending',
                        timestamp: serverTimestamp(),
                        createdAt: new Date().toISOString()
                    });
                    setStatus('success');
                    setSecretKey('');
                    setVideoUrl('');
                    setTimeout(() => setStatus(null), 3000);
                } catch(err) { setStatus('error'); }
            };

            const readMsg = async(id) => {
                await updateDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'messages', id), { read: true });
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div className="md:col-span-2 space-y-8">
                        {/* PROFILE HEADER */}
                        <div className="bg-gray-900/50 p-6 rounded-xl border border-gray-800 flex items-center justify-between">
                            <div>
                                <h3 className="text-gray-500 text-xs uppercase font-bold mb-1">Identidade do Agente</h3>
                                {isEditing ? (
                                    <div className="flex gap-2 mt-1">
                                        <input value={newName} onChange={e=>setNewName(e.target.value)} className="bg-black border border-gray-700 rounded px-2 py-1 text-white text-lg outline-none focus:border-red-500"/>
                                        <button onClick={saveProfileName} className="bg-green-600 px-3 rounded text-sm font-bold hover:bg-green-500">Salvar</button>
                                        <button onClick={()=>setIsEditing(false)} className="bg-gray-700 px-3 rounded text-sm hover:bg-gray-600">Cancelar</button>
                                    </div>
                                ) : (
                                    <div className="text-2xl font-bold text-white flex items-center gap-3">
                                        {userProfile?.displayName || "Carregando..."} 
                                        <button onClick={()=>setIsEditing(true)} className="text-gray-500 hover:text-white transition-colors"><Edit2 size={16}/></button>
                                    </div>
                                )}
                            </div>
                            <div className="text-right">
                                <div className="text-gray-500 text-xs uppercase">Email Vinculado</div>
                                <div className="text-sm font-mono text-gray-300">{user.email}</div>
                            </div>
                        </div>

                        <div className="bg-gray-900 p-8 rounded-xl border border-red-900/30 relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-10"><Gamepad2 size={100}/></div>
                            <h2 className="text-2xl font-bold mb-6 flex gap-3 text-white items-center relative z-10"><div className="p-2 bg-red-600 rounded"><Gamepad2 size={24}/></div> Enviar Speedrun</h2>
                            <form onSubmit={sendRun} className="space-y-4 relative z-10">
                                <div><label className="text-xs text-gray-500 uppercase font-bold mb-1 block">Código Criptografado</label><input value={secretKey} onChange={e=>setSecretKey(e.target.value)} required placeholder="Cole o token gerado pelo jogo..." className="w-full bg-black p-4 rounded border border-gray-700 focus:border-red-500 outline-none font-mono text-sm text-red-500"/></div>
                                <div><label className="text-xs text-gray-500 uppercase font-bold mb-1 block">Link da Prova (YouTube/Twitch)</label><input value={videoUrl} onChange={e=>setVideoUrl(e.target.value)} type="url" placeholder="https://..." className="w-full bg-black p-4 rounded border border-gray-700 focus:border-red-500 outline-none text-sm text-white"/></div>
                                <button disabled={status==='loading'} className={`w-full py-4 font-bold rounded uppercase tracking-widest transition-all ${status==='success'?'bg-green-600 text-white':'bg-red-600 hover:bg-red-700 text-white'}`}>{status === 'loading' ? 'Enviando Dados...' : status === 'success' ? 'Run Enviada com Sucesso!' : 'Submeter Run'}</button>
                            </form>
                        </div>

                        <div className="space-y-4">
                            <h3 className="text-lg font-bold text-gray-400 flex items-center gap-2"><Trophy size={16}/> Histórico de Tentativas</h3>
                            {runs.length === 0 && <div className="p-8 bg-gray-900/50 rounded-lg border border-dashed border-gray-800 text-center text-gray-600">Nenhuma run enviada ainda.</div>}
                            {runs.map(run => (
                                <div key={run.id} className="bg-gray-900/80 p-5 rounded-lg flex flex-col justify-between items-start border border-gray-800 hover:border-gray-600 transition-colors gap-4">
                                    <div className="w-full">
                                        <div className="font-mono text-xs text-gray-500 bg-black/50 p-2 rounded mb-2 break-all">{run.encryptedToken}</div>
                                        <div className="flex flex-wrap items-center gap-4 text-xs text-gray-400"><span>{new Date(run.createdAt).toLocaleDateString()}</span>{run.videoUrl && <a href={run.videoUrl} target="_blank" className="text-blue-400 hover:underline flex items-center gap-1"><PlayCircle size={12}/> Vídeo</a>}</div>
                                    </div>
                                    {run.decryptedData && (
                                        <div className="flex w-full justify-between items-center border-t border-gray-800 pt-4 mt-2">
                                            <div className="text-left"><div className="font-bold text-green-400 font-mono text-xl">{formatDisplayTime(run.decryptedData.tempo)}</div><div className="text-xs text-red-500 font-bold">{run.decryptedData.mortes} mortes</div></div>
                                            <span className={`px-3 py-1 text-xs font-bold rounded-full uppercase tracking-wider ${run.status==='approved'?'bg-green-900/30 text-green-400 border border-green-900':run.status==='rejected'?'bg-red-900/30 text-red-400 border border-red-900':'bg-yellow-900/30 text-yellow-400 border border-yellow-900'}`}>{run.status === 'approved' ? 'Validada' : run.status === 'rejected' ? 'Recusada' : 'Análise'}</span>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="bg-gray-900 p-6 rounded-xl border border-red-900/30 h-fit max-h-[80vh] overflow-y-auto flex flex-col">
                        <h2 className="text-xl font-bold mb-6 flex gap-2 text-white items-center pb-4 border-b border-gray-800"><Mail className="text-orange-500"/> Notificações</h2>
                        <div className="space-y-3 flex-1">
                            {msgs.length === 0 && <div className="text-gray-600 text-center py-10 flex flex-col items-center"><Mail size={40} className="mb-2 opacity-20"/>Caixa vazia.</div>}
                            {msgs.map(m => (
                                <div onClick={()=>readMsg(m.id)} key={m.id} className={`p-4 rounded-lg cursor-pointer border transition-all hover:translate-x-1 ${!m.read ? 'bg-red-900/10 border-red-500/50' : 'bg-black/40 border-transparent hover:bg-black/60'}`}>
                                    <div className="flex justify-between mb-2"><span className={`font-bold text-sm ${!m.read ? 'text-white' : 'text-gray-400'}`}>{m.title}</span>{!m.read && <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse shadow-[0_0_10px_red]"></span>}</div><p className="text-xs text-gray-400 leading-relaxed">{m.body}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const AdminPanel = ({ user }) => {
            if (user.email !== ADMIN_EMAIL) return <div className="p-20 text-center text-red-600 font-bold text-2xl uppercase tracking-widest bg-black h-screen flex items-center justify-center">Acesso Negado</div>;

            const [runs, setRuns] = React.useState([]);
            const [approvedRuns, setApprovedRuns] = React.useState([]);
            const [key, setKey] = React.useState('');
            const [processedRuns, setProcessedRuns] = React.useState([]);
            const [msgTarget, setMsgTarget] = React.useState(null); 
            const [msgText, setMsgText] = React.useState('');

            React.useEffect(() => {
                const fetchKey = async () => {
                    try {
                        const docSnap = await getDoc(doc(db, 'artifacts', APP_ID, 'admin', 'secrets'));
                        if(docSnap.exists() && docSnap.data().key) setKey(docSnap.data().key);
                    } catch(e) {}
                }
                fetchKey();
            }, []);

            React.useEffect(() => {
                const unsub = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'runs'), (snap) => {
                    const data = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    setRuns(data.filter(r => r.status === 'pending'));
                    setApprovedRuns(data.filter(r => r.status === 'approved').sort((a,b) => (a.sortTime||0) - (b.sortTime||0)));
                });
                return () => unsub();
            }, []);

            React.useEffect(() => {
                if(!key) return;
                const processed = runs.map(run => {
                    const decoded = lerHash(run.encryptedToken, key);
                    return { ...run, decodedData: decoded, isValid: !!decoded };
                });
                setProcessedRuns(processed);
            }, [runs, key]);

            const handleDecision = async (run, approved) => {
                const runRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'runs', run.id);
                const userRef = collection(db, 'artifacts', APP_ID, 'users', run.userId, 'messages');
                if (approved && run.decodedData) {
                    await updateDoc(runRef, { status: 'approved', decryptedData: run.decodedData, sortTime: timeToSeconds(run.decodedData.tempo) });
                    await addDoc(userRef, { title: 'Run Aprovada! 🔥', body: `Tempo ${run.decodedData.tempo} validado!`, createdAt: serverTimestamp(), read: false });
                } else {
                    await updateDoc(runRef, { status: 'rejected' });
                    await addDoc(userRef, { title: 'Run Recusada ❌', body: 'Submissão rejeitada.', createdAt: serverTimestamp(), read: false });
                }
            };

            const handleDelete = async (runId) => {
                if(confirm("EXCLUIR run do ranking?")) await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'runs', runId));
            }

            const sendDirectMessage = async () => {
                if(!msgTarget || !msgText) return;
                await addDoc(collection(db, 'artifacts', APP_ID, 'users', msgTarget.userId, 'messages'), { title: 'Mensagem do Admin 🛡️', body: msgText, createdAt: serverTimestamp(), read: false });
                alert("Mensagem enviada!"); setMsgTarget(null); setMsgText('');
            }

            const acceptAllValid = async () => {
                const validOnes = processedRuns.filter(r => r.isValid);
                if(confirm(`Aprovar ${validOnes.length} runs válidas?`)) { for(const run of validOnes) await handleDecision(run, true); }
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-8">
                    <div className="flex flex-col md:flex-row justify-between items-end mb-10 border-b border-gray-800 pb-6 gap-4">
                        <div><h2 className="text-3xl md:text-4xl font-black text-red-600 uppercase tracking-tighter">Painel de Controle</h2><p className="text-gray-500 text-sm mt-1">Bem-vindo, Administrador.</p></div>
                        <div className="bg-gray-900 px-4 py-2 rounded border border-gray-800 flex gap-3 items-center"><Lock size={16} className={key ? "text-green-500" : "text-red-500"}/><div className="flex flex-col"><span className="text-[10px] uppercase font-bold text-gray-500">Status da Chave</span><span className={`text-xs font-mono font-bold ${key ? "text-green-500" : "text-red-500"}`}>{key ? "ATIVA" : "OFFLINE"}</span></div></div>
                    </div>

                    <div className="mb-12">
                        <div className="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                            <h3 className="text-xl font-bold text-white flex items-center gap-2"><span className="w-2 h-6 bg-orange-500 rounded-sm"></span>Fila de Análise <span className="bg-gray-800 text-xs px-2 py-1 rounded-full text-gray-300">{runs.length}</span></h3>
                            {processedRuns.filter(r => r.isValid).length > 0 && <button onClick={acceptAllValid} className="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded font-bold shadow-lg flex items-center justify-center gap-2 hover:scale-105 transition-transform"><CheckCircle size={18}/> APROVAR EM MASSA ({processedRuns.filter(r => r.isValid).length})</button>}
                        </div>
                        <div className="grid gap-4">
                            {processedRuns.length === 0 && <div className="p-10 bg-gray-900/30 border border-gray-800 rounded-xl text-center text-gray-600 flex flex-col items-center"><CheckCircle size={48} className="mb-4 opacity-20"/>Fila limpa.</div>}
                            {processedRuns.map(run => (
                                <div key={run.id} className="bg-gray-900 border border-gray-800 p-6 rounded-xl flex flex-col gap-6 hover:border-gray-600 transition-colors shadow-lg">
                                    <div className="w-full">
                                        <div className="flex items-center gap-3 mb-2"><span className="font-bold text-xl text-white">{run.userName}</span><span className="text-xs text-gray-500 bg-black px-2 py-1 rounded border border-gray-800">{new Date(run.createdAt).toLocaleString()}</span></div>
                                        <div className="font-mono text-xs text-gray-600 bg-black p-3 rounded mb-4 break-all border border-gray-800">{run.encryptedToken}</div>
                                        {run.isValid ? <div className="flex flex-wrap gap-4 md:gap-6 text-sm bg-black/40 p-4 rounded border border-gray-800"><div className="flex flex-col"><span className="text-[10px] uppercase text-gray-500 font-bold">Tempo</span><span className="text-green-400 font-mono font-bold text-xl">{formatDisplayTime(run.decodedData.tempo)}</span></div><div className="flex flex-col"><span className="text-[10px] uppercase text-gray-500 font-bold">Mortes</span><span className="text-red-400 font-mono font-bold text-xl">{run.decodedData.mortes}</span></div><div className="flex flex-col"><span className="text-[10px] uppercase text-gray-500 font-bold">Data</span><span className="text-gray-300 font-mono font-bold text-xl">{run.decodedData.data}</span></div></div> : <div className="bg-red-900/20 text-red-400 p-3 rounded border border-red-900/50 flex items-center gap-2 font-bold text-sm"><XCircle size={18}/> Token inválido.</div>}
                                        {run.videoUrl && <a href={run.videoUrl} target="_blank" className="mt-3 text-blue-400 hover:text-blue-300 hover:underline flex gap-2 text-sm items-center font-bold"><PlayCircle size={16}/> Ver Vídeo</a>}
                                    </div>
                                    <div className="flex gap-3 w-full"><button onClick={() => handleDecision(run, false)} className="flex-1 px-6 py-3 rounded border border-red-800 text-red-500 hover:bg-red-900/20 font-bold text-sm transition-colors uppercase">Recusar</button>{run.isValid && <button onClick={() => handleDecision(run, true)} className="flex-1 px-6 py-3 rounded bg-green-700 hover:bg-green-600 text-white font-bold text-sm shadow-lg transition-colors uppercase flex items-center justify-center gap-2"><CheckCircle size={16}/> Aprovar</button>}</div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="border-t border-gray-800 pt-10">
                        <h3 className="text-xl font-bold text-white flex items-center gap-2 mb-6"><span className="w-2 h-6 bg-blue-500 rounded-sm"></span>Gerenciar Ranking Ativo <span className="bg-gray-800 text-xs px-2 py-1 rounded-full text-gray-300">{approvedRuns.length}</span></h3>
                        <div className="bg-gray-900 rounded-xl overflow-hidden border border-gray-800">
                            {approvedRuns.length === 0 ? <div className="p-8 text-center text-gray-600">Vazio.</div> : (
                                <table className="w-full text-left">
                                    <thead className="bg-black text-gray-400 text-xs uppercase"><tr><th className="p-4">Pos</th><th className="p-4">Jogador</th><th className="p-4 text-right">Tempo</th><th className="p-4 text-right">Ações</th></tr></thead>
                                    <tbody className="divide-y divide-gray-800">{approvedRuns.map((run, i) => (<tr key={run.id} className="hover:bg-white/5"><td className="p-4 font-bold text-gray-500">#{i+1}</td><td className="p-4 font-bold">{run.userName}</td><td className="p-4 text-right font-mono text-green-500">{formatDisplayTime(run.decryptedData.tempo)}</td><td className="p-4 text-right flex justify-end gap-2"><button onClick={() => setMsgTarget({ userId: run.userId, name: run.userName })} className="p-2 bg-blue-900/30 text-blue-400 rounded hover:bg-blue-900 hover:text-white transition-colors"><MessageSquare size={16}/></button><button onClick={() => handleDelete(run.id)} className="p-2 bg-red-900/30 text-red-500 rounded hover:bg-red-900 hover:text-white transition-colors"><Trash2 size={16}/></button></td></tr>))}</tbody>
                                </table>
                            )}
                        </div>
                    </div>

                    {msgTarget && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <div className="bg-gray-900 p-6 rounded-xl border border-blue-900 w-full max-w-md">
                                <h3 className="text-xl font-bold mb-4">Mensagem para {msgTarget.name}</h3>
                                <textarea className="w-full bg-black p-3 rounded border border-gray-700 text-white h-32 focus:border-blue-500 outline-none mb-4" placeholder="Digite..." value={msgText} onChange={e => setMsgText(e.target.value)}></textarea>
                                <div className="flex gap-2"><button onClick={() => setMsgTarget(null)} className="flex-1 py-2 rounded bg-gray-800 hover:bg-gray-700">Cancelar</button><button onClick={sendDirectMessage} className="flex-1 py-2 rounded bg-blue-600 hover:bg-blue-700 font-bold flex items-center justify-center gap-2"><Send size={16}/> Enviar</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const Ranking = () => {
            const [list, setList] = React.useState([]);

            React.useEffect(() => {
                const unsub = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'runs'), (snap) => {
                    const approved = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(r => r.status === 'approved').sort((a,b) => (a.sortTime || 9999999) - (b.sortTime || 9999999));
                    setList(approved);
                });
                return () => unsub();
            }, []);

            return (
                <div className="max-w-5xl mx-auto px-4 py-12">
                    <h2 className="text-4xl md:text-5xl font-black text-center mb-12 text-transparent bg-clip-text bg-gradient-to-r from-red-600 to-orange-500 uppercase tracking-tighter drop-shadow-sm">Ranking Mundial</h2>
                    <div className="bg-gray-900 border border-red-900/30 rounded-xl overflow-hidden shadow-2xl">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[600px]">
                                <thead className="bg-red-900/20 text-red-200 text-sm uppercase tracking-wider"><tr><th className="p-5 text-center w-24">Rank</th><th className="p-5">Jogador</th><th className="p-5 text-right">Data</th><th className="p-5 text-right">Mortes</th><th className="p-5 text-right">Tempo Final</th></tr></thead>
                                <tbody className="divide-y divide-gray-800">
                                    {list.map((run, idx) => (
                                        <tr key={run.id} className="hover:bg-white/5 transition-colors group">
                                            <td className="p-5 text-center font-bold text-xl text-gray-500">{idx===0 ? <span className="text-yellow-400 text-2xl">1</span> : idx===1 ? <span className="text-gray-300 text-2xl">2</span> : idx===2 ? <span className="text-orange-500 text-2xl">3</span> : idx+1}</td>
                                            <td className="p-5 font-bold flex items-center gap-3 text-white">
                                                {idx===0 && <Trophy size={18} className="text-yellow-500"/>}
                                                <div className="flex flex-col">
                                                    <span>{run.userName}</span>
                                                    {run.videoUrl && <a href={run.videoUrl} target="_blank" className="text-gray-600 hover:text-white text-xs flex items-center gap-1 mt-1 transition-colors"><PlayCircle size={10}/> Ver Video</a>}
                                                </div>
                                            </td>
                                            <td className="p-5 text-right font-mono text-gray-400 text-sm">{run.decryptedData.data}</td>
                                            <td className="p-5 text-right font-mono text-red-500 font-bold group-hover:text-red-400 transition-colors">{run.decryptedData.mortes} <Skull size={12} className="inline ml-1 mb-1"/></td>
                                            <td className="p-5 text-right font-mono text-green-500 text-xl font-bold group-hover:text-green-400 transition-colors shadow-green-500/10">{formatDisplayTime(run.decryptedData.tempo)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        {list.length === 0 && <div className="p-20 text-center text-gray-600 flex flex-col items-center"><Trophy size={48} className="mb-4 opacity-20"/>O ranking está vazio.</div>}
                    </div>
                </div>
            );
        };

        const Winners = () => {
            const [timeLeft, setTimeLeft] = React.useState({});
            const target = new Date('2026-02-15T00:00:00');
            const [stats, setStats] = React.useState(null);
            
            const now = new Date(); 
            const revealed = now >= target;

            React.useEffect(() => {
                const interval = setInterval(() => {
                    const current = new Date();
                    const diff = target - current;
                    if (diff <= 0) { clearInterval(interval); return; }
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                    setTimeLeft({ days, hours, minutes, seconds });
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            React.useEffect(() => {
                if(!revealed) return;
                const unsub = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'runs'), (snap) => {
                    const runs = snap.docs.map(d=>d.data()).filter(r=>r.status==='approved');
                    if(runs.length > 0) {
                        const byTime = [...runs].sort((a,b) => a.sortTime - b.sortTime);
                        const byDate = [...runs].sort((a,b) => parseRunDate(a.decryptedData.data) - parseRunDate(b.decryptedData.data)); // Sort by oldest date
                        const byLast = [...runs].sort((a,b) => b.sortTime - a.sortTime);
                        setStats({ fastest: byTime[0], first: byDate[0], last: byLast[0] });
                    }
                });
                return () => unsub();
            }, [revealed]);

            if(!revealed) return (
                <div className="min-h-[80vh] flex flex-col items-center justify-center text-white bg-black p-4 text-center">
                    <div className="relative mb-8"><div className="absolute inset-0 bg-red-600 blur-xl opacity-20 animate-pulse"></div><Lock size={64} className="text-red-600 relative z-10"/></div>
                    <h2 className="text-4xl md:text-5xl font-black mb-4 uppercase tracking-tighter">Confidencial</h2>
                    <p className="text-gray-500 mb-12 text-lg md:text-xl font-light">Os resultados estão selados até 15/02/2026</p>
                    <div className="grid grid-cols-4 gap-2 md:gap-8 text-center font-mono w-full max-w-2xl">
                        <div className="bg-gray-900 p-2 md:p-4 rounded-lg border border-red-900/30"><div className="text-xl md:text-5xl font-bold text-white mb-2">{String(timeLeft.days || 0).padStart(2, '0')}</div><div className="text-[10px] md:text-xs text-red-500 uppercase tracking-widest">Dias</div></div>
                        <div className="bg-gray-900 p-2 md:p-4 rounded-lg border border-red-900/30"><div className="text-xl md:text-5xl font-bold text-white mb-2">{String(timeLeft.hours || 0).padStart(2, '0')}</div><div className="text-[10px] md:text-xs text-red-500 uppercase tracking-widest">Horas</div></div>
                        <div className="bg-gray-900 p-2 md:p-4 rounded-lg border border-red-900/30"><div className="text-xl md:text-5xl font-bold text-white mb-2">{String(timeLeft.minutes || 0).padStart(2, '0')}</div><div className="text-[10px] md:text-xs text-red-500 uppercase tracking-widest">Min</div></div>
                        <div className="bg-gray-900 p-2 md:p-4 rounded-lg border border-red-900/30"><div className="text-xl md:text-5xl font-bold text-white mb-2">{String(timeLeft.seconds || 0).padStart(2, '0')}</div><div className="text-[10px] md:text-xs text-red-500 uppercase tracking-widest">Seg</div></div>
                    </div>
                </div>
            );

            const WinnerCard = ({ title, desc, data, rank, color, prize, icon: Icon }) => (
                <div className="relative z-10 flex flex-col items-center">
                    <div className={`text-${color}-500 font-bold mb-1 uppercase tracking-widest text-sm`}>{title}</div>
                    <div className="text-gray-500 text-[10px] uppercase mb-2">{desc}</div>
                    <div className={`w-20 h-20 rounded-full bg-gray-800 border-4 border-${color}-600 flex items-center justify-center mb-[-40px] z-20 shadow-lg`}><span className={`text-3xl font-black text-${color}-400`}>{rank}</span></div>
                    <div className={`bg-gradient-to-b from-gray-800 to-gray-900 w-full rounded-t-lg border-t-4 border-${color}-600 pt-16 pb-8 px-6 shadow-2xl h-80 flex flex-col justify-between`}>
                        {data ? (
                            <>
                                <div><div className="text-2xl font-bold text-white mb-1 truncate">{data.userName}</div><div className="flex justify-between items-center text-xs text-gray-400 mt-2 border-b border-gray-700 pb-2"><span>Data:</span><span className="font-mono text-white">{data.decryptedData.data}</span></div><div className="flex justify-between items-center text-xs text-gray-400 mt-2"><span>Mortes:</span><span className="font-mono text-red-400 font-bold">{data.decryptedData.mortes}</span></div></div>
                                <div className="text-center"><div className={`bg-black/50 rounded p-2 mb-2 inline-block ${prize ? 'text-green-400' : 'text-gray-500'}`}><span className="font-bold">{prize || "Menção Honrosa"}</span></div><div className={`text-${color}-500 font-mono text-2xl font-bold`}>{formatDisplayTime(data.decryptedData.tempo)}</div></div>
                            </>
                        ) : <span className="text-gray-600 my-auto">--</span>}
                    </div>
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto px-4 py-12 text-center min-h-[80vh] flex flex-col justify-center">
                    <h2 className="text-5xl md:text-7xl font-black mb-24 text-red-600 uppercase drop-shadow-[0_0_30px_rgba(220,38,38,0.4)] tracking-tighter">Lendas de 2026</h2>
                    <div className="flex flex-col md:flex-row items-end justify-center gap-12 md:gap-4 relative px-4">
                        <div className="w-full md:w-1/3 order-2 md:order-1 podium-2"><WinnerCard title="O Pioneiro" desc="Quem zerou primeiro" data={stats?.first} rank="#2" color="gray" prize="R$ 20,00" icon={Calendar} /></div>
                        <div className="w-full md:w-1/3 order-1 md:order-2 z-20 podium-1 -mx-0 md:-mx-2 mb-8 md:mb-0">
                             <div className="relative z-10 flex flex-col items-center transform md:-translate-y-8">
                                <Crown size={48} className="text-yellow-400 mb-2 animate-bounce"/>
                                <div className="text-yellow-400 font-bold mb-1 uppercase tracking-widest text-lg glow-text">Velocista Supremo</div>
                                <div className="text-gray-400 text-xs uppercase mb-2">Quem zerou mais rápido</div>
                                <div className="w-28 h-28 rounded-full bg-yellow-900/80 border-4 border-yellow-400 flex items-center justify-center mb-[-50px] z-20 shadow-[0_0_30px_rgba(234,179,8,0.4)]"><span className="text-5xl font-black text-yellow-400">#1</span></div>
                                <div className="bg-gradient-to-b from-gray-800 to-black w-full rounded-t-lg border-t-4 border-yellow-400 pt-20 pb-10 px-6 shadow-2xl h-96 flex flex-col justify-between relative overflow-hidden">
                                    <div className="absolute inset-0 bg-yellow-500/5 animate-pulse"></div>
                                    {stats?.fastest ? (
                                        <>
                                            <div className="relative z-10"><div className="text-4xl font-black text-white mb-1 truncate">{stats.fastest.userName}</div><div className="flex justify-between items-center text-sm text-gray-400 mt-4 border-b border-gray-700 pb-2"><span>Data:</span><span className="font-mono text-white">{stats.fastest.decryptedData.data}</span></div><div className="flex justify-between items-center text-sm text-gray-400 mt-2"><span>Mortes:</span><span className="font-mono text-red-500 font-bold">{stats.fastest.decryptedData.mortes}</span></div></div>
                                            <div className="relative z-10 text-center"><div className="bg-yellow-500/20 border border-yellow-500/50 rounded p-3 mb-4 inline-block"><span className="text-yellow-400 font-black text-2xl">R$ 30,00</span></div><div className="text-green-400 font-mono text-4xl font-bold">{formatDisplayTime(stats.fastest.decryptedData.tempo)}</div></div>
                                        </>
                                    ) : <span className="text-gray-600 my-auto">--</span>}
                                </div>
                             </div>
                        </div>
                        <div className="w-full md:w-1/3 order-3 podium-3"><WinnerCard title="O Sobrevivente" desc="Quem ficou em último" data={stats?.last} rank="#3" color="orange" prize={null} icon={Skull} /></div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('home');
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [unread, setUnread] = React.useState(0);

            React.useEffect(() => { return onAuthStateChanged(auth, u => { setUser(u); setLoading(false); }); }, []);

            React.useEffect(() => {
                if(!user) return;
                const unsub = onSnapshot(collection(db, 'artifacts', APP_ID, 'users', user.uid, 'messages'), snap => {
                    setUnread(snap.docs.filter(d => !d.data().read).length);
                });
                return () => unsub();
            }, [user]);

            if(loading) return <div className="h-screen flex items-center justify-center bg-black"><div className="w-16 h-16 border-t-4 border-red-600 border-r-transparent rounded-full animate-spin"></div></div>;

            return (
                <div className="min-h-screen flex flex-col">
                    <Navbar activeTab={activeTab} setActiveTab={setActiveTab} user={user} unreadCount={unread}/>
                    <main className="fade-in flex-grow">
                        {activeTab === 'home' && <Hero setActiveTab={setActiveTab}/>}
                        {activeTab === 'auth' && <AuthPage setUser={setUser} setActiveTab={setActiveTab}/>}
                        {activeTab === 'profile' && user && <Profile user={user}/>}
                        {activeTab === 'admin' && user && <AdminPanel user={user}/>}
                        {activeTab === 'ranking' && <Ranking/>}
                        {activeTab === 'winners' && <Winners/>}
                    </main>
                    <footer className="py-8 text-center text-gray-800 text-xs bg-black border-t border-red-900/10 mt-auto">
                        <p>&copy; 2024-2026 O Último Meme. Competição Oficial.</p>
                        <p className="mt-2 text-[10px] text-gray-900">Sistema Seguro v2.5.0</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
